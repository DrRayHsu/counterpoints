name: post
on:
  schedule:
    # Each slot has a backup because GitHub can delay or skip scheduled runs.
    # The bot only posts if the last post was long enough ago, so a backup
    # that runs after a successful main run just checks replies.
    - cron: "23 15 * * *"   # ~8:23am Pacific (PDT)
    - cron: "23 17 * * *"   # ~10:23am Pacific, backup
    - cron: "23 1 * * *"    # ~6:23pm Pacific (PDT)
    - cron: "23 3 * * *"    # ~8:23pm Pacific, backup
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only check the setup; don't post"
        type: boolean
        default: true
permissions:
  contents: write   # save data/ and quotes.json
  issues: write     # #found submissions become issues for review
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py ${{ inputs.check_only && '--check' || '' }}
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          VOTE_SALT: ${{ secrets.VOTE_SALT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save what the bot learned
        if: ${{ always() && !inputs.check_only }}
        run: |
          git config user.name "counterpoints-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data quotes.json
          git commit -m "Run $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push
